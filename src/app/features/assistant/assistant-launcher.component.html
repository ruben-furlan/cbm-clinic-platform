@if (showNudge() && !triage.isOpen()) {
  <div class="assistant-nudge" role="status">
    <p class="assistant-nudge__text">{{ nudgeText }}</p>
    <button
      type="button"
      class="assistant-nudge__close"
      (click)="dismissNudge()"
      aria-label="Cerrar aviso"
    >
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path
          fill="currentColor"
          d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"
        />
      </svg>
    </button>
  </div>
}

<button
  type="button"
  class="assistant-fab"
  [class.assistant-fab--open]="triage.isOpen()"
  (click)="toggle()"
  [attr.aria-expanded]="triage.isOpen()"
  aria-haspopup="dialog"
  aria-controls="assistant-panel"
  [attr.aria-label]="triage.isOpen() ? 'Cerrar el asistente de orientación' : label"
>
  @if (triage.isOpen()) {
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path
        fill="currentColor"
        d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"
      />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M12 3c-4.97 0-9 3.36-9 7.5 0 2.3 1.25 4.36 3.2 5.73-.13 1.2-.6 2.4-1.4 3.32 1.55-.2 2.94-.8 4.02-1.62.99.25 2.05.38 3.18.38 4.97 0 9-3.36 9-7.81C21 6.36 16.97 3 12 3z"
      />
      <path
        fill="var(--color-primary)"
        d="M11.13 12.9h1.62v-.2c.01-.5.19-.83.72-1.16.66-.4 1.12-.9 1.12-1.72 0-1.15-.93-1.87-2.27-1.87-1.25 0-2.24.66-2.28 1.95h1.7c.03-.42.34-.66.72-.66.4 0 .68.25.68.63 0 .35-.25.58-.6.8-.6.37-.96.75-.96 1.7v.53zm.83 2.63c.53 0 .95-.4.95-.9s-.42-.9-.95-.9-.96.4-.96.9.43.9.96.9z"
      />
    </svg>
  }
  <span class="assistant-fab__label">{{ label }}</span>
</button>

@if (triage.isOpen()) {
  <app-assistant-panel />
}
